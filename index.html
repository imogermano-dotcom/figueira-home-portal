<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Figueira Home</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;min-height:100vh}

/* Auth */
#auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.auth-card{background:#fff;border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.12);padding:40px 36px;width:100%;max-width:400px}
.auth-card .logo{text-align:center;margin-bottom:28px}
.auth-card .logo h1{font-size:1.4rem;font-weight:700;color:#1a3c5e;margin-top:8px}
.auth-card .logo p{font-size:.8rem;color:#9ca3af;margin-top:4px}
.auth-field{margin-bottom:16px}
.auth-field label{display:block;font-size:.78rem;font-weight:600;color:#4b5563;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.auth-field input{width:100%;padding:10px 14px;border:1.5px solid #d1d5db;border-radius:8px;font-size:.9rem;outline:none;transition:border-color .2s}
.auth-field input:focus{border-color:#2d6a9f}
.auth-btn{width:100%;padding:11px;background:linear-gradient(135deg,#1a3c5e,#2d6a9f);color:#fff;border:none;border-radius:8px;font-size:.92rem;font-weight:600;cursor:pointer;margin-top:8px;transition:opacity .2s}
.auth-btn:hover{opacity:.9}
.auth-btn:disabled{opacity:.6;cursor:not-allowed}
.auth-error{font-size:.8rem;color:#dc2626;margin-top:10px;text-align:center;min-height:20px}

/* App */
#app-screen{display:none;min-height:100vh;flex-direction:column}
header{background:linear-gradient(135deg,#1a3c5e,#2d6a9f);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{font-size:1.1rem;font-weight:700;letter-spacing:.4px}
.header-right{display:flex;align-items:center;gap:12px}
.user-badge{font-size:.78rem;background:rgba(255,255,255,.15);padding:4px 12px;border-radius:20px}
.logout-btn{font-size:.78rem;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;padding:5px 12px;border-radius:6px;cursor:pointer;transition:background .2s}
.logout-btn:hover{background:rgba(255,255,255,.22)}

main{flex:1;padding:24px;max-width:900px;margin:0 auto;width:100%}

/* Search */
.search-box{background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.07);padding:20px}
.search-box h2{font-size:1rem;font-weight:700;color:#1a3c5e;margin-bottom:14px}
.search-row{display:flex;gap:10px}
.search-row textarea{flex:1;padding:10px 14px;border:1.5px solid #d1d5db;border-radius:8px;font-size:.88rem;font-family:inherit;resize:none;outline:none;transition:border-color .2s;min-height:54px}
.search-row textarea:focus{border-color:#2d6a9f}
.search-row button{padding:10px 20px;background:#1a3c5e;color:#fff;border:none;border-radius:8px;font-size:.88rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .2s;align-self:flex-end}
.search-row button:hover{background:#2d6a9f}
.search-row button:disabled{opacity:.6;cursor:not-allowed}
.suggestions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.sug{font-size:.73rem;color:#2d6a9f;background:#e8f0fb;padding:4px 10px;border-radius:20px;cursor:pointer;border:none;font-family:inherit;transition:background .2s}
.sug:hover{background:#d0e2f7}

/* Results */
#results{margin-top:20px;display:grid;gap:10px}
.result-meta{font-size:.82rem;color:#6b7280;margin-bottom:4px}
.card{background:#fff;border:1px solid #e5e7eb;border-left:4px solid #2d6a9f;border-radius:8px;padding:12px 16px}
.card.hot{background:#fff7f7;border-color:#fca5a5;border-left-color:#dc2626}
.card-header{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.card-ref{font-weight:700;color:#1a3c5e;font-size:.92rem}
.card-client{color:#374151;font-size:.83rem}
.card-resp{background:#e8eef6;color:#1a3c5e;font-size:.71rem;padding:2px 8px;border-radius:10px}
.card-link{font-size:.76rem;color:#2563eb;text-decoration:none;margin-left:auto;white-space:nowrap}
.card-imovel{margin-top:4px;font-size:.74rem;color:#4b5563}
.card-meta{margin-top:4px;font-size:.74rem;color:#6b7280;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-tarefa{margin-top:5px}
.tag-red{display:inline-flex;align-items:center;gap:4px;background:#fef2f2;color:#b91c1c;font-size:.71rem;font-weight:700;padding:2px 8px;border-radius:20px;border:1px solid #fecaca}
.tag-green{display:inline-flex;align-items:center;gap:4px;background:#f0fdf4;color:#15803d;font-size:.71rem;font-weight:600;padding:2px 8px;border-radius:20px;border:1px solid #bbf7d0}
.tag-gray{font-size:.69rem;color:#9ca3af;font-style:italic}
.card-summary{margin-top:8px;font-size:.82rem;color:#374151;background:#f9fafb;border-left:3px solid #d1d5db;padding:7px 10px;border-radius:0 5px 5px 0;line-height:1.5}
.card-summary.hot-sum{background:#fff1f2;border-left-color:#fca5a5}
.card-preview{margin-top:8px;font-size:.79rem;color:#4b5563;background:#f9fafb;border-left:3px solid #d1d5db;padding:7px 10px;border-radius:0 5px 5px 0;line-height:1.5}
.card-nonotas{margin-top:6px;font-size:.74rem;color:#9ca3af;font-style:italic}
.loading{text-align:center;padding:40px;color:#6b7280;font-size:.9rem}
.err-box{padding:14px;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;color:#991b1b;font-size:.85rem}

/* Admin panel */
#admin-panel{margin-top:24px;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.07);padding:20px}
#admin-panel h2{font-size:1rem;font-weight:700;color:#1a3c5e;margin-bottom:14px}
.admin-table{width:100%;border-collapse:collapse;font-size:.83rem}
.admin-table th{text-align:left;padding:8px 10px;background:#f0f4f8;color:#4b5563;font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.4px}
.admin-table td{padding:8px 10px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
.admin-table input{padding:5px 8px;border:1.5px solid #d1d5db;border-radius:6px;font-size:.82rem;width:200px;outline:none}
.admin-table input:focus{border-color:#2d6a9f}
.save-btn{padding:4px 12px;background:#1a3c5e;color:#fff;border:none;border-radius:6px;font-size:.78rem;cursor:pointer}
.save-btn:hover{background:#2d6a9f}
.save-ok{color:#15803d;font-size:.75rem;margin-left:6px}
</style>
</head>
<body>

<!-- Auth -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="logo">
      <h1>🏠 Portal Figueira Home</h1>
      <p>Pesquisa IA de Oportunidades</p>
    </div>
    <div class="auth-field">
      <label>Email</label>
      <input type="email" id="email" placeholder="email@example.com" autocomplete="email">
    </div>
    <div class="auth-field">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="auth-btn" id="login-btn" onclick="doLogin()">Entrar</button>
    <div class="auth-error" id="auth-err"></div>
  </div>
</div>

<!-- App -->
<div id="app-screen">
  <header>
    <h1>🏠 Portal Figueira Home</h1>
    <div class="header-right">
      <span class="user-badge" id="user-badge"></span>
      <button class="logout-btn" onclick="doLogout()">Sair</button>
    </div>
  </header>
  <main>
    <div class="search-box">
      <h2>Pesquisa de Oportunidades</h2>
      <div class="search-row">
        <textarea id="q" placeholder="Ex: clientes que procuram T2 com urgência, angariações sem tarefa..." rows="2" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();doSearch()}"></textarea>
        <button id="search-btn" onclick="doSearch()">Pesquisar</button>
      </div>
      <div class="suggestions">
        <button class="sug" onclick="setSug(this)">Leads mais activos</button>
        <button class="sug" onclick="setSug(this)">Angariações sem tarefa ou em atraso</button>
        <button class="sug" onclick="setSug(this)">Clientes com proposta activa</button>
        <button class="sug" onclick="setSug(this)">Oportunidades de venda com urgência</button>
        <button class="sug" onclick="setSug(this)">Tarefas em atraso</button>
      </div>
    </div>

    <div id="results"></div>

    <!-- Painel admin: mapeamento ego_responsavel -->
    <div id="admin-panel" style="display:none">
      <h2>⚙️ Mapeamento Consultores → eGO</h2>
      <p style="font-size:.8rem;color:#6b7280;margin-bottom:12px">Define o nome exacto de cada consultor no campo "responsavel" do eGO para que a pesquisa seja filtrada correctamente.</p>
      <table class="admin-table">
        <thead><tr><th>Utilizador</th><th>Email</th><th>Nome no eGO (responsavel)</th><th></th></tr></thead>
        <tbody id="admin-tbody"></tbody>
      </table>
    </div>
  </main>
</div>

<script>
// ── Config ──────────────────────────────────────────────────────────────────
var DOORSTEP_URL = 'https://fykbogojkcqokvopnmkz.supabase.co'
var DOORSTEP_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ5a2JvZ29qa2Nxb2t2b3BubWt6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc3NTc2MDgsImV4cCI6MjA3MzMzMzYwOH0.rih9rJONycxXm-FQ-HANFunSsiMT0KOubF0F9QgLNOw'
var EGO_EDGE = 'https://zphasvfopnbzwnaidsnw.supabase.co/functions/v1/query-leads'

var sb = supabase.createClient(DOORSTEP_URL, DOORSTEP_ANON)
var _profile = null

// ── Auth ─────────────────────────────────────────────────────────────────────
async function doLogin() {
  var btn = document.getElementById('login-btn')
  var errEl = document.getElementById('auth-err')
  var email = document.getElementById('email').value.trim()
  var pw = document.getElementById('password').value
  errEl.textContent = ''
  if (!email || !pw) { errEl.textContent = 'Preenche email e password.'; return }
  btn.disabled = true; btn.textContent = 'A entrar...'
  var { error } = await sb.auth.signInWithPassword({ email, password: pw })
  btn.disabled = false; btn.textContent = 'Entrar'
  if (error) { errEl.textContent = error.message; return }
  await loadApp()
}

async function doLogout() {
  await sb.auth.signOut()
  _profile = null
  document.getElementById('app-screen').style.display = 'none'
  document.getElementById('auth-screen').style.display = 'flex'
  document.getElementById('results').innerHTML = ''
}

document.getElementById('email').addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('password').focus() })
document.getElementById('password').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin() })

async function loadApp() {
  var { data: { user } } = await sb.auth.getUser()
  if (!user) return
  var { data: profile } = await sb.from('profiles').select('nome,email,role,ego_responsavel').eq('user_id', user.id).single()
  _profile = profile || { nome: user.email, role: 'consultor', ego_responsavel: null }

  document.getElementById('user-badge').textContent = (_profile.nome || user.email) + (_profile.role === 'admin' ? ' · Admin' : '')
  document.getElementById('auth-screen').style.display = 'none'
  document.getElementById('app-screen').style.display = 'flex'
  document.getElementById('app-screen').style.flexDirection = 'column'

  if (_profile.role === 'admin') await loadAdminPanel()
}

// ── Admin panel ──────────────────────────────────────────────────────────────
async function loadAdminPanel() {
  document.getElementById('admin-panel').style.display = 'block'
  var { data: profiles } = await sb.from('profiles').select('user_id,nome,email,ego_responsavel').order('nome')
  var tbody = document.getElementById('admin-tbody')
  tbody.innerHTML = ''
  ;(profiles || []).forEach(function(p) {
    var tr = document.createElement('tr')
    tr.innerHTML = '<td>'+esc(p.nome||'')+'</td>'
      + '<td style="color:#6b7280">'+esc(p.email||'')+'</td>'
      + '<td><input type="text" value="'+esc(p.ego_responsavel||'')+'" id="ego_'+p.user_id+'" placeholder="ex: Alexandra Santos"></td>'
      + '<td><button class="save-btn" onclick="saveEgoResp(\''+p.user_id+'\')">Guardar</button><span class="save-ok" id="ok_'+p.user_id+'"></span></td>'
    tbody.appendChild(tr)
  })
}

async function saveEgoResp(uid) {
  var val = document.getElementById('ego_'+uid).value.trim()
  var okEl = document.getElementById('ok_'+uid)
  var { error } = await sb.from('profiles').update({ ego_responsavel: val || null }).eq('user_id', uid)
  okEl.textContent = error ? '✗ Erro' : '✓ Guardado'
  setTimeout(function(){ okEl.textContent = '' }, 2000)
}

// ── Search ───────────────────────────────────────────────────────────────────
function setSug(el) {
  document.getElementById('q').value = el.textContent
  doSearch()
}

async function doSearch() {
  var q = document.getElementById('q').value.trim()
  if (!q) return
  var btn = document.getElementById('search-btn')
  var res = document.getElementById('results')
  btn.disabled = true; btn.textContent = 'A pesquisar...'
  res.innerHTML = '<div class="loading">🔍 A analisar a pergunta e pesquisar oportunidades...</div>'

  var body = { question: q }
  // consultor: forçar filtro pelo seu responsavel no eGO
  if (_profile && _profile.role !== 'admin' && _profile.ego_responsavel) {
    body.force_responsavel = _profile.ego_responsavel
  }

  try {
    var r = await fetch(EGO_EDGE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    })
    var data = await r.json().catch(function(){ return {} })
    if (!r.ok) throw new Error((data && data.error) ? data.error : 'HTTP ' + r.status)
    renderResults(data, q)
  } catch(err) {
    res.innerHTML = '<div class="err-box"><strong>Erro:</strong> ' + esc(err.message) + '</div>'
  }
  btn.disabled = false; btn.textContent = 'Pesquisar'
}

function renderResults(data, q) {
  var res = document.getElementById('results')
  var results = data.results || []
  var descr = data.description || ''
  if (!results.length) {
    res.innerHTML = '<div style="padding:16px;color:#6b7280">Nenhum resultado para: <em>'+esc(q)+'</em></div>'
    return
  }
  var hotCount = results.filter(function(r){ return r.hot }).length
  var h = '<div class="result-meta">'
    + (descr ? '<em>'+esc(descr)+'</em> — ' : '')
    + '<strong>'+results.length+'</strong> resultado(s)'
    + (hotCount ? ' · <span style="color:#dc2626;font-weight:700">🔥 '+hotCount+' hot</span>' : '')
    + '</div>'

  results.forEach(function(r) {
    var isHot = r.hot === true
    h += '<div class="card'+(isHot?' hot':'')+'">'
    // Header
    h += '<div class="card-header">'
    if (isHot) h += '<span title="Lead quente">🔥</span>'
    h += '<span class="card-ref">'+esc(r.oportunidade_ref)+'</span>'
    if (r.cliente_nome) h += '<span class="card-client">· '+esc(r.cliente_nome)+'</span>'
    if (r.tipo_oportunidade) h += '<span class="card-resp">'+esc(r.tipo_oportunidade)+'</span>'
    if (r.responsavel && (!_profile || _profile.role === 'admin')) h += '<span class="card-resp">'+esc(r.responsavel)+'</span>'
    if (r.url) h += '<a class="card-link" href="'+esc(r.url)+'" target="_blank" rel="noopener">Ver no eGO ↗</a>'
    else h += '<span style="font-size:.74rem;color:#9ca3af;margin-left:auto">'+esc(r.oportunidade_ref)+'</span>'
    h += '</div>'
    // Imóvel
    var iparts = []
    if (r.titulo_imovel) iparts.push(r.titulo_imovel)
    else if (r.imovel_natureza) iparts.push(r.imovel_natureza)
    if (r.imovel_freguesia) iparts.push(r.imovel_freguesia)
    if (r.imovel_concelho && r.imovel_concelho !== r.imovel_freguesia) iparts.push(r.imovel_concelho)
    var preco = r.imovel_venda > 0 ? r.imovel_venda : (r.imovel_arrendamento > 0 ? r.imovel_arrendamento : null)
    if (preco) iparts.push(new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(preco))
    if (iparts.length) h += '<div class="card-imovel">🏠 '+esc(iparts.join(' · '))+'</div>'
    else if (r.preferencia_imovel) h += '<div class="card-imovel">🔍 '+esc(r.preferencia_imovel)+'</div>'
    // Meta
    var diasDesde = ''; var corData = '#6b7280'
    if (r.ultimo_contacto) {
      var dias = Math.floor((Date.now() - new Date(r.ultimo_contacto).getTime()) / 86400000)
      diasDesde = dias === 0 ? 'hoje' : dias === 1 ? 'ontem' : 'há '+dias+' dias'
      corData = dias <= 14 ? '#15803d' : dias <= 60 ? '#b45309' : '#dc2626'
    }
    if (r.etapa_atual || r.ultimo_contacto || r.ego_data_criacao) {
      h += '<div class="card-meta">'
      if (r.etapa_atual) h += '<span>'+esc(r.etapa_atual)+(r.estado_proposta?' · '+esc(r.estado_proposta):'')+'</span>'
      if (r.ultimo_contacto) h += '<span style="color:'+corData+';font-weight:600">📅 '+esc(diasDesde)+'</span>'
      if (r.ego_data_criacao) h += '<span>criado '+esc(r.ego_data_criacao)+'</span>'
      h += '</div>'
    }
    // Tarefa
    h += '<div class="card-tarefa">'
    if (r.tarefa) {
      var t = r.tarefa
      if (t.atrasada) {
        var atr = t.dias_atraso > 0 ? ' · '+t.dias_atraso+' dia'+(t.dias_atraso===1?'':'s')+' atraso' : ''
        h += '<span class="tag-red">⚠ '+esc(t.titulo)+esc(atr)+'</span>'
      } else {
        h += '<span class="tag-green">📋 '+esc(t.titulo)+(t.due?' · '+esc(t.due):'')+'</span>'
      }
    } else {
      h += '<span class="tag-gray">sem tarefa</span>'
    }
    h += '</div>'
    // Notas
    if (r.summary) {
      h += '<div class="card-summary'+(isHot?' hot-sum':'')+'">'+esc(r.summary)+'</div>'
    } else if (r.notas_preview && r.notas_preview.length) {
      h += '<div class="card-preview">'
      r.notas_preview.forEach(function(n){ h += '<div>· '+esc(n)+'</div>' })
      h += '</div>'
    } else {
      h += '<div class="card-nonotas">Sem notas registadas.</div>'
    }
    h += '</div>'
  })
  res.innerHTML = h
}

function esc(s) {
  if (!s) return ''
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

// ── Init ─────────────────────────────────────────────────────────────────────
sb.auth.onAuthStateChange(function(event, session) {
  if (session) loadApp()
})
</script>
</body>
</html>
